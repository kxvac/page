name: Extract project ZIP

on:
  push:
    paths:
      - 'gamer-profile-site-cloudflare.zip'
      - '.github/workflows/extract-project.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf gamer-profile-site-cf
          unzip -o gamer-profile-site-cloudflare.zip
          cp -R gamer-profile-site-cf/. .
          rm -rf gamer-profile-site-cf gamer-profile-site-cloudflare.zip index-DgrNH6Qa.js

      - name: Commit extracted project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Extract project files'
          git push
